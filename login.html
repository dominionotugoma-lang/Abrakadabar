
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | ABRAKADABAR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(ellipse at top, #25215c, transparent 55%),
        #070816;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border: 6px solid #5148ff;
      border-radius: 22px;
      background: rgba(14, 16, 43, 0.94);
      box-shadow: 0 0 35px #5148ff30;
    }

    .logo {
      color: #b7a6ff;
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    h1 {
      margin: 22px 0 10px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #b9bad0;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #090b20;
      border: 1px solid #393b65;
      border-radius: 9px;
      outline: none;
    }

    input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 10px #8b5cf655;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      color: white;
      background: linear-gradient(90deg, #6d28d9, #2563eb);
      border: 2px solid #a78bfa;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px #8b5cf688;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      color: #b9bad0;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: #c4b5fd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">ABRAKADABAR</div>

    <h1>Student Login</h1>
    <p class="subtitle">
      Welcome back! Log in to access your student dashboard.
    </p>

    <form id="login-form">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        minlength="3"
        maxlength="30"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">LOGIN TO ACCOUNT ↗</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <div class="links">
      <p>Don't have an account?
        <a href="register.html">Register here</a>
      </p>
      <p><a href="index.html">Back to homepage</a></p>
    </div>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", async event => {
      event.preventDefault();

      message.style.display = "block";
      message.textContent = "Checking your account...";
      message.style.background = "#222449";
      button.disabled = true;

      try {
        const response = await fetch("/api/students/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Login failed.");
        }

        message.style.background = "#12382d";
        message.textContent = result.message;

        window.location.href = result.redirect;
      } catch (error) {
        message.style.background = "#451a2d";
        message.textContent =
          error.message === "Failed to fetch"
            ? "Cannot connect to the server. Make sure it is running."
            : error.message;
      } finally {
        button.disabled = false;
      }
    });

  </script>

<div class="login-logout-area">
  <button type="button" id="logout-button" class="logout-btn" hidden>
    ↪ LOG OUT
  </button>
</div>

</body>
</html>
